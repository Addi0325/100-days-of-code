<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 1 - 100 Days of Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      max-width: 400px;
    }
    button {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #2ea043;
    }
    .status {
      margin-top: 15px;
      font-weight: bold;
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Day 1: Kickoff!</h1>
    <p>100 Days of Code Challenge</p>
    <button onclick="logProgress()">Mark Today Complete</button>
    <div id="status" class="status">Status: Waiting to complete...</div>
  </div>

  <script>
    function logProgress() {
      const statusElement = document.getElementById("status");
      statusElement.innerText = "Status: Day 1 Completed! 🎉";
      statusElement.style.color = "#3fb950";
    }
  </script>

</body>
</html>
